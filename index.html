<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AS Trademaster Academy | Trading Education</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
    scroll-behavior:smooth;
}

body{
    background:#070b10;
    color:#fff;
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:92%;
    max-width:1200px;
    margin:auto;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:999;
    background:rgba(5,9,14,.96);
    border-bottom:1px solid #1d2935;
    backdrop-filter:blur(10px);
}

.navbar{
    min-height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:21px;
    font-weight:800;
    color:#00e5ff;
}

.logo span{
    color:#fff;
}

.nav-links{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav-links a{
    color:#ddd;
    font-size:14px;
    transition:.3s;
}

.nav-links a:hover{
    color:#00e5ff;
}

.menu-btn{
    display:none;
    font-size:28px;
    cursor:pointer;
}

/* HERO */
.hero{
    min-height:90vh;
    display:flex;
    align-items:center;
    text-align:center;
    background:
    radial-gradient(circle at top,#123344 0,#070b10 45%);
}

.hero-content{
    width:100%;
}

.hero h1{
    font-size:clamp(38px,7vw,72px);
    line-height:1.05;
    margin-bottom:20px;
}

.hero h1 span{
    color:#00e5ff;
}

.hero p{
    max-width:750px;
    margin:0 auto 30px;
    color:#b9c3cc;
    font-size:18px;
}

.btn{
    display:inline-block;
    background:#00e5ff;
    color:#001015;
    padding:13px 25px;
    border-radius:8px;
    font-weight:700;
    border:none;
    cursor:pointer;
    transition:.3s;
    margin:5px;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(0,229,255,.2);
}

.btn-outline{
    background:transparent;
    color:#00e5ff;
    border:1px solid #00e5ff;
}

/* GENERAL */
section{
    padding:80px 0;
}

.section-title{
    text-align:center;
    margin-bottom:45px;
}

.section-title h2{
    font-size:35px;
    margin-bottom:10px;
}

.section-title p{
    color:#9da8b2;
}

/* CARDS */
.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.card{
    background:#0d141c;
    border:1px solid #1d2b37;
    border-radius:14px;
    padding:28px;
    transition:.3s;
}

.card:hover{
    transform:translateY(-5px);
    border-color:#00e5ff;
}

.card-icon{
    font-size:38px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#aeb8c0;
    font-size:15px;
}

/* ABOUT */
.about{
    background:#090f15;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
    align-items:center;
}

.about-box{
    background:#0d141c;
    border:1px solid #1c2934;
    padding:30px;
    border-radius:15px;
}

.about-box h3{
    color:#00e5ff;
    margin-bottom:15px;
}

.about-box p{
    color:#b8c2ca;
}

/* MARKETS */
.market-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.market-card{
    padding:30px;
    border-radius:15px;
    background:#0d141c;
    border:1px solid #1d2b37;
    text-align:center;
}

.market-card h3{
    margin:12px 0;
}

.market-card p{
    color:#aab5bd;
    margin-bottom:20px;
}

.market-btn{
    display:inline-block;
    padding:10px 18px;
    border-radius:7px;
    background:#00e5ff;
    color:#001015;
    font-weight:bold;
}

/* COURSE */
.price{
    font-size:28px;
    font-weight:800;
    color:#00e5ff;
    margin:15px 0;
}

.course-list{
    list-style:none;
    margin:20px 0;
}

.course-list li{
    margin:9px 0;
    color:#c0c9d0;
}

/* SUCCESS */
.success{
    background:#090f15;
}

.success-card{
    background:#0d141c;
    border:1px solid #1d2b37;
    border-radius:14px;
    padding:25px;
}

.success-card h3{
    color:#00e5ff;
}

.success-card p{
    color:#b9c2ca;
    margin-top:8px;
}

/* CONDITIONS */
.conditions{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
}

.condition{
    background:#0d141c;
    border-left:4px solid #00e5ff;
    padding:22px;
    border-radius:8px;
}

.condition h3{
    margin-bottom:8px;
}

.condition p{
    color:#aeb8c0;
}

/* PAYMENT */
.payment-wrapper{
    max-width:850px;
    margin:auto;
}

.payment-box{
    background:#0d141c;
    border:1px solid #263541;
    border-radius:15px;
    padding:30px;
    margin-bottom:20px;
}

.payment-method{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    padding:15px;
    background:#111b24;
    border-radius:8px;
    margin:10px 0;
}

.payment-number{
    color:#00e5ff;
    font-weight:bold;
    word-break:break-all;
}

.copy-btn{
    background:#00e5ff;
    border:0;
    padding:8px 13px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

/* FORM */
.form{
    max-width:850px;
    margin:auto;
    background:#0d141c;
    border:1px solid #263541;
    padding:30px;
    border-radius:15px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    font-weight:bold;
}

input,
select,
textarea{
    width:100%;
    padding:13px;
    background:#080d13;
    border:1px solid #2a3946;
    color:#fff;
    border-radius:7px;
    outline:none;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#00e5ff;
}

textarea{
    min-height:120px;
    resize:vertical;
}

.form-message{
    margin-top:15px;
    color:#00e5ff;
    font-weight:bold;
}

/* CONTACT */
.contact-box{
    max-width:800px;
    margin:auto;
    text-align:center;
    background:#0d141c;
    padding:35px;
    border-radius:15px;
    border:1px solid #1d2b37;
}

.contact-box p{
    color:#adb8c1;
    margin:10px 0;
}

.social{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
}

.social a{
    border:1px solid #2a3946;
    padding:10px 18px;
    border-radius:7px;
    color:#00e5ff;
}

/* DISCLAIMER */
.disclaimer{
    background:#05080c;
    border-top:1px solid #17232d;
}

.disclaimer p{
    color:#87939c;
    font-size:13px;
    text-align:center;
    max-width:900px;
    margin:auto;
}

/* FOOTER */
footer{
    background:#030507;
    text-align:center;
    padding:25px 10px;
    color:#7e899
